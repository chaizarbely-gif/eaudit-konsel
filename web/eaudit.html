<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>e-Audit · Inspektorat Daerah Konawe Selatan</title>
<link rel="stylesheet" href="assets/insp.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="lg"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/></svg></div>
      <div><b>e<span>Audit</span></b><small>Inspektorat Daerah Konsel</small></div></div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div>
    <header class="topbar">
      <button class="hb" id="hb">☰</button><span class="title" id="ttl">Dasbor</span><span class="sp"></span>
      <input id="gsearch" placeholder="Cari SPJ atau OPD…">
      <span class="user"><span class="av" id="av">A</span><span id="uname"></span><a id="gs" style="cursor:pointer">Ganti sandi</a><a onclick="API.logout()" style="cursor:pointer">Keluar</a></span>
    </header>
    <main class="content"><div id="view"><div class="card pad">Memuat…</div></div></main>
  </div>
</div>
<div class="ovl" id="ovl"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script src="assets/common.js"></script><script src="assets/jdih.js"></script><script src="assets/audit-awal.js"></script>
<script>
(async () => {
const $ = id => document.getElementById(id), { esc, rp, rpS, ST, JENIS, BLN, tgl } = EA;
const toast = t => { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 2800) };
const ME = await API.me(); if (!ME) { location.href = '/login.html'; return } if (!['auditor', 'ketua', 'irban', 'inspektur', 'admin'].includes(ME.peran)) { location.href = '/'; return }
EA.init(await API.get('/api/ref')); const { OPD, OPDN } = EA, NOW_M = EA.NOW_M;
const KELOLA = ['irban', 'inspektur', 'admin'].includes(ME.peran);
if (ME.lingkup) document.querySelector('.content').insertAdjacentHTML('afterbegin', `<div class="info" style="margin-bottom:12px">🔒 <b>${EA.PERAN[ME.peran]}:</b> Anda hanya melihat obrik yang ditugaskan — ${ME.lingkup.length ? ME.lingkup.map(o => EA.esc(EA.OPDN[o] || o)).join(', ') : '<b>belum ada penugasan</b>. Hubungi Administrator.'}</div>`);
$('uname').textContent = ME.nama; $('av').textContent = (ME.nama || 'A')[0]; $('hb').onclick = () => $('side').classList.toggle('open');

// ---------------- modal & ikon
function modal(judul, isi, tombol, ok, lebar) {
  $('modal').style.maxWidth = (lebar || 620) + 'px';
  $('modal').innerHTML = `<div class="mh"><h3>${judul}</h3></div><div class="mb">${isi}</div><div class="mf"><button class="btn btn-out" id="mX">${tombol ? 'Batal' : 'Tutup'}</button>${tombol || ''}</div>`;
  $('ovl').classList.add('on'); $('mX').onclick = tutup; if (ok) $('mY').onclick = ok;
}
const tutup = () => $('ovl').classList.remove('on'); $('ovl').onclick = e => { if (e.target === $('ovl')) tutup() };
$('gs').onclick = () => modal('Ganti kata sandi', `<div class="fm"><label class="w2">Kata sandi lama<input type="password" id="pl"></label><label class="w2">Kata sandi baru (min. 8 karakter)<input type="password" id="pb"></label></div>`,
  '<button class="btn btn-blue" id="mY">Simpan</button>', async () => { try { await API.post('/api/password', { lama: $('pl').value, baru: $('pb').value }); tutup(); toast('Kata sandi diganti') } catch (e) { toast(e.message) } });
const IC = { book: '<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20v3H6.5"/><path d="M9 7h7M9 11h5"/>', grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>', cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>', file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/>', home: '<path d="m3 11 9-7 9 7"/><path d="M5 10v10h14V10"/>', shield: '<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/>',
  gift: '<rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18"/>', chart: '<path d="M4 20V4M4 20h16"/><path d="M8 16v-5M12 16V8M16 16v-7"/>', chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  act: '<path d="M3 12h4l3-8 4 16 3-8h4"/>', plane: '<path d="M2 16 22 8l-6 12-3-5z"/><path d="M13 15 22 8"/>', folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>', clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>' };
const MENU = [['UTAMA'], ['dasbor', 'Dasbor', 'grid'], ['pkpt', 'PKPT Berbasis Risiko', 'list'], ['agenda', 'Agenda & Surat Tugas', 'cal'],
  ['PENGAWASAN'], ['pengawasan', 'Pengawasan Bulanan (SPJ)', 'inbox', 'belum'], ['awal', 'Audit Awal Otomatis', 'check'], ['lhp', 'LHP & Tindak Lanjut', 'file', 'tl'], ['m-desa', 'Asistensi Desa', 'home'], ['m-probity', 'Probity Audit', 'shield'],
  ['PENCEGAHAN'], ['m-mcp', 'MCP KPK', 'shield'], ['m-upg', 'Pengendalian Gratifikasi', 'gift'], ['m-sakip', 'SAKIP', 'chart'], ['m-konsul', 'Konsultasi', 'chat'],
  ['ADMINISTRASI'], ['m-akt', 'E-Aktivitas', 'act'], ['m-pd', 'Perjalanan Dinas', 'plane'], ['m-arsip', 'Arsip Multimedia', 'folder'], ['REFERENSI'], ['jdih', 'JDIH Pengawasan', 'book'], ...(ME.lingkup ? [] : [['riwayat', 'Riwayat Aktivitas', 'clock']]), ...(ME.peran === 'admin' ? [['pengguna', 'Pengguna & Akses', 'users']] : [])];
const PH = { 'm-desa': 'Menarik hasil asistensi kecamatan dari SIMPEL DESA dan menerbitkan keterangan kesiapan desa.', 'm-probity': 'Pengawalan real time paket strategis memakai data kontrak dan progres MONALISA.',
  'm-mcp': 'OPD mengunggah data dukung MCP, Inspektorat memverifikasi sebelum dikirim ke aplikasi KPK.', 'm-upg': 'Pelaporan dan penanganan gratifikasi oleh Unit Pengendalian Gratifikasi.',
  'm-sakip': 'Evaluasi SAKIP perangkat daerah dengan kertas kerja daring.', 'm-konsul': 'Layanan konsultasi OPD kepada Inspektorat beserta riwayat jawabannya.',
  'm-akt': 'Catatan aktivitas harian auditor sebagai dasar kinerja.', 'm-pd': 'Pengajuan dan pertanggungjawaban perjalanan dinas pegawai Inspektorat.', 'm-arsip': 'Arsip digital LHP final yang dapat dicari, termasuk untuk permintaan BPK dan APH.' };
let CNT = { belum: 0, tl: 0 };
function drawMenu(cur) {
  $('menu').innerHTML = MENU.map(m => m.length === 1 ? `<div class="g">${m[0]}</div>` :
    `<a href="#${m[0]}" class="${cur === m[0] ? 'on' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${IC[m[2]]}</svg>${m[1]}${m[3] && CNT[m[3]] ? `<span class="tag">${CNT[m[3]]}</span>` : ''}${m[0].startsWith('m-') ? '<span style="margin-left:auto;font-size:9.5px;opacity:.55">tahap 2</span>' : ''}</a>`).join('');
}

// ---------------- data
let D = { spj: [], audit: {}, temuan: [], agenda: [], ringkas: [] };
async function muat(...apa) {
  const peta = { lhp: '/api/lhp', spj: '/api/spj', audit: '/api/audit', temuan: '/api/temuan', agenda: '/api/agenda', ringkas: '/api/ringkas', pkpt: '/api/pkpt', users: '/api/users', log: '/api/log?limit=300' };
  const hasil = await Promise.all(apa.map(k => API.get(peta[k]))); apa.forEach((k, i) => D[k] = hasil[i]);
  if (D.spj && D.audit) CNT.belum = D.spj.filter(p => aSt(p) !== 'selesai').length;
  if (D.temuan) CNT.tl = D.temuan.filter(t => t.status === 'menunggu').length;
}
const aSt = p => (D.audit[p.id] || {}).status || 'belum';
const AST = { belum: ['Belum diperiksa', 'b-red'], proses: ['Sedang diperiksa', 'b-amber'], selesai: ['Selesai', 'b-green'] };
const nTem = a => a ? Object.values(a.cek || {}).filter(v => v === 't').length : 0;
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
function kpi(ic, bg, c, v, l, href) { return `<${href ? `a href="${href}"` : 'div'} class="card kpi" style="text-decoration:none;color:inherit"><div class="ic" style="background:${bg};color:${c}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[ic]}</svg></div><div><b>${v}</b><span>${l}</span></div></${href ? 'a' : 'div'}>` }
function berkasLink(f) { return (f.parts || [f]).map(x => x.src ? `<a href="${encodeURI(x.src)}#page=${x.page}" target="_blank">${esc(x.name)} ↗</a>` : x.path ? `<a href="${encodeURI(x.path)}" target="_blank">${esc(x.name)} ↗</a> · ${Math.round(x.size / 1e3)} KB · scan bendahara` : `${esc(x.name)} · ${Math.round((x.size || 0) / 1e3)} KB${x.fake ? ' · contoh' : ''}`).join('<br>') + (f.ocr && f.ocr.dok ? `<br><span style="color:var(--blue)">✨ AI mengenali: ${f.ocr.dok}</span>` : '') }

// ================= DASBOR
let dayIdx = 0;
function vDasbor() {
  const P = D.spj, bl = P.filter(p => aSt(p) !== 'selesai').length, tbuka = D.temuan.filter(t => t.status !== 'tuntas').length;
  const os = OPD.map(o => { const L = P.filter(p => p.opd === o.k); return { ...o, n: L.length, done: L.filter(p => aSt(p) === 'selesai').length } });
  const sud = os.filter(o => o.n && o.done === o.n).length, pc = Math.round(sud / OPD.length * 100);
  const gu = D.ringkas.filter(r => r.sumber === 'gu'), guT = gu.reduce((s, r) => s + r.n, 0), guA = gu.filter(r => ST[r.status] && ST[r.status][2] >= 1).reduce((s, r) => s + r.n, 0);
  const days = []; const b = new Date(); b.setHours(0, 0, 0, 0); for (let i = 0; i < 7; i++) { const d = new Date(b); d.setDate(b.getDate() + i); days.push(d) }
  const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'], evs = D.agenda.filter(e => e.tgl === iso(days[dayIdx]));
  const recent = P.slice().sort((a, b) => (b.tglAju || '').localeCompare(a.tglAju || '')).slice(0, 7);
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(), start = (new Date(y, m, 1).getDay() + 6) % 7, dim = new Date(y, m + 1, 0).getDate(), ag = new Set(D.agenda.map(e => e.tgl));
  let cal = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map(h => `<div class="h">${h}</div>`).join('') + '<div class="c o"></div>'.repeat(start);
  for (let d = 1; d <= dim; d++) { const s = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`; cal += `<div class="c ${d === now.getDate() ? 't' : ''}">${d}${ag.has(s) ? '<i></i>' : ''}</div>` }
  return `${guT ? `<div class="card pad" style="margin-bottom:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#F2F8F4;border-color:#BFE0C8">
     <div style="width:46px;height:46px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:22px;flex:none">✓</div>
     <div style="flex:1;min-width:260px"><b style="font-size:15px">Uji coba: SPJ GU I · Bag. Perencanaan &amp; Keuangan Setda</b><div class="hint" style="font-size:12.5px">${guT} transaksi hasil OCR · <b>${guA}</b> sudah diajukan bendahara dan dapat diperiksa.</div></div>
     ${guA ? '<span class="btn btn-green" data-opd="PK" style="cursor:pointer">Periksa →</span>' : '<span class="badge b-amber">Menunggu diajukan bendahara</span>'}</div>` : ''}
   <div class="row r-kpi">${kpi('inbox', '#E4EEF9', 'var(--blue)', P.length, 'SPJ diajukan bendahara OPD', '#pengawasan')}${kpi('check', '#FBE7E5', 'var(--red)', bl, 'Belum selesai diperiksa', '#pengawasan')}
    ${kpi('file', '#FBF1DC', 'var(--amber)', tbuka, `Temuan terbuka · ${CNT.tl} TL menunggu verifikasi`, '#lhp')}${kpi('grid', '#E3F3E8', 'var(--green)', sud + '/' + OPD.length, 'OPD selesai diawasi')}</div>
   <div class="row r-main">
    <div class="card pad"><h2>Agenda Kegiatan</h2><div class="hint">📅 ${tgl(iso(days[dayIdx]))} · <a href="#agenda">kelola agenda</a></div>
      <div class="days">${days.map((d, i) => { const n = D.agenda.filter(e => e.tgl === iso(d)).length; return `<div class="day ${i === dayIdx ? 'on' : ''}" data-day="${i}"><small>${HARI[d.getDay()]}</small><b>${d.getDate()}</b><span class="n">${'<i></i>'.repeat(Math.min(n, 3))}</span></div>` }).join('')}</div>
      <div class="ev"><table><thead><tr><th style="width:42%">Acara</th><th>Tempat</th><th>Objek</th><th>Surat</th></tr></thead><tbody>
      ${evs.length ? evs.map(e => `<tr><td><b>${esc(e.acara)}</b><small>Pukul ${esc(e.jam)} – selesai</small><small>Penanggung jawab: ${esc(e.pj)} · PIC: ${esc(e.pic)}</small></td><td>${esc(e.tempat)}</td><td>${esc(e.objek)}</td><td>${e.no_st ? `<span class="badge b-green" style="cursor:pointer" data-st="${e.id}">ST ${esc(e.no_st.split('/')[1] || '')}</span>` : '–'}</td></tr>`).join('')
        : '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:22px">Tidak ada agenda pada hari ini.</td></tr>'}</tbody></table></div></div>
    <div class="card pad"><h2>Hasil Pengawasan Bulanan</h2><div class="hint">📅 Pemeriksaan SPJ · ${BLN[NOW_M - 1]} ${new Date().getFullYear()}</div>
      <div class="donut" style="background:conic-gradient(var(--blue2) 0 ${pc}%,var(--red) ${pc}% 100%)"><span><div>${pc}%<small>OPD selesai</small></div></span></div>
      <div class="lg2"><span><i style="background:var(--blue2)"></i>Sudah</span><span><i style="background:var(--red)"></i>Belum</span></div>
      <div class="opdl">${os.map(o => `<div data-opd="${o.k}"><span>${esc(o.n_ || OPDN[o.k])} <small style="color:var(--muted)">${o.done}/${o.n}</small></span>${o.n && o.done === o.n ? '<span class="badge b-green">✓ Selesai</span>' : o.n ? '<span class="badge b-red">✕ Belum selesai</span>' : '<span class="badge b-grey">Belum ada SPJ</span>'}</div>`).join('')}</div></div></div>
   <div class="row r-main">
    <div class="card pad"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h2>SPJ Terbaru dari Bendahara OPD</h2><div class="hint">Ditarik dari portal bendahara · tanpa berkas fisik</div></div><a class="btn btn-out" href="#pengawasan" style="text-decoration:none">Lihat semua</a></div>
      <div class="tw" style="margin-top:10px"><table class="tbl"><thead><tr><th>SPJ</th><th>OPD</th><th>Diajukan</th><th>Pemeriksaan</th><th></th></tr></thead><tbody>
      ${recent.map(p => `<tr><td><b>${esc(p.nama)}</b><div class="kode">${p.id} · ${JENIS[p.j].n}</div></td><td>${esc(OPDN[p.opd])}</td><td>${p.tglAju ? tgl(p.tglAju) : BLN[p.m - 1]}</td><td><span class="badge ${AST[aSt(p)][1]}">${AST[aSt(p)][0]}</span></td><td><a class="btn btn-blue" href="#kk/${p.id}" style="text-decoration:none">Periksa</a></td></tr>`).join('') || '<tr><td colspan="5" class="hint" style="padding:18px;text-align:center">Belum ada SPJ diajukan.</td></tr>'}</tbody></table></div></div>
    <div class="card pad"><h2>Kalender Inspektorat</h2><div class="hint">${BLN[m]} ${y} · titik = ada agenda</div><div class="cal">${cal}</div></div></div>`;
}

// ================= PENGAWASAN BULANAN
let F = { opd: 'ALL', st: 'ALL', q: '' };
function vPengawasan() {
  let L = D.spj;
  if (F.opd !== 'ALL') L = L.filter(p => p.opd === F.opd); if (F.st !== 'ALL') L = L.filter(p => aSt(p) === F.st);
  if (F.q) L = L.filter(p => (p.nama + p.id + OPDN[p.opd] + p.penerima).toLowerCase().includes(F.q));
  const ord = { belum: 0, proses: 1, selesai: 2 };
  L = L.slice().sort((a, b) => ((b.nyata ? 1 : 0) - (a.nyata ? 1 : 0)) || (ord[aSt(a)] - ord[aSt(b)]) || (b.tglAju || '').localeCompare(a.tglAju || ''));
  return `<div class="card pad"><h2>Pengawasan Bulanan SPJ</h2><div class="hint">Post audit atas SPJ yang telah diajukan bendahara OPD.</div>
   <div class="flt"><select id="fo"><option value="ALL">Semua OPD</option>${OPD.map(o => `<option value="${o.k}" ${F.opd === o.k ? 'selected' : ''}>${esc(o.n)}</option>`).join('')}</select>
    <select id="fs">${[['ALL', 'Semua status'], ['belum', 'Belum diperiksa'], ['proses', 'Sedang diperiksa'], ['selesai', 'Selesai']].map(([k, n]) => `<option value="${k}" ${F.st === k ? 'selected' : ''}>${n}</option>`).join('')}</select>
    <input id="fq" placeholder="Cari SPJ…" value="${esc(F.q)}"><span class="hint">${L.length} SPJ</span></div>
   <div class="info">🔒 Inspektorat hanya membaca dokumen. Perbaikan dilakukan bendahara OPD melalui portalnya.</div>
   <div class="tw" style="margin-top:10px"><table class="tbl"><thead><tr><th>SPJ</th><th>OPD</th><th>Jenis belanja</th><th>Bulan</th><th class="num">Nilai</th><th>Status SPJ</th><th>Pemeriksaan</th><th>Temuan</th><th></th></tr></thead><tbody>
   ${L.map(p => { const a = D.audit[p.id]; return `<tr><td><b>${esc(p.nama)}</b><div class="kode">${p.id}${p.tglAju ? ' · diajukan ' + tgl(p.tglAju) : ''}</div></td><td>${esc(OPDN[p.opd])}</td><td>${JENIS[p.j].n}<div class="kode">${EA.MEK[p.mek || 'GU']}</div></td><td>${BLN[p.m - 1].slice(0, 3)}</td><td class="num">${rpS(p.nilai)}</td>
    <td><span class="badge b-grey">${ST[p.st][0]}</span></td><td><span class="badge ${AST[aSt(p)][1]}">${AST[aSt(p)][0]}</span></td><td>${a && a.status === 'selesai' ? (nTem(a) ? `<span class="badge b-red">${nTem(a)} temuan</span>` : '<span class="badge b-green">Nihil</span>') : '–'}</td>
    <td><a class="btn ${aSt(p) === 'selesai' ? 'btn-out' : 'btn-blue'}" href="#kk/${p.id}" style="text-decoration:none">${aSt(p) === 'selesai' ? 'Lihat' : 'Kertas kerja'}</a></td></tr>` }).join('') || '<tr><td colspan="9" style="text-align:center;padding:24px;color:var(--muted)">Tidak ada SPJ.</td></tr>'}
   </tbody></table></div></div>`;
}
function bindPengawasan() {
  $('fo').onchange = e => { F.opd = e.target.value; gambar() }; $('fs').onchange = e => { F.st = e.target.value; gambar() };
  $('fq').oninput = e => { F.q = e.target.value.toLowerCase(); clearTimeout(window._fq); window._fq = setTimeout(() => { gambar(); const q = $('fq'); q.focus(); q.setSelectionRange(q.value.length, q.value.length) }, 300) };
}

// ================= KERTAS KERJA
let KK = null;
function vKK(id, st) {
  const p = D.spj.find(x => x.id === id); if (!p) return '<div class="card pad">SPJ tidak ditemukan atau belum diajukan.</div>';
  const a = st || D.audit[id] || { cek: {}, cat: {}, status: 'belum' }; KK = { p, a: st || JSON.parse(JSON.stringify(a)) }; if (!KK.a.cat) KK.a.cat = {}; if (!KK.a.cek) KK.a.cek = {};
  const kritis = p.j === 'KON' && p.keu - p.fisik > 10, ro = a.status === 'selesai';
  return `<div class="card pad"><div class="hint"><a href="#pengawasan">Pengawasan Bulanan</a> › Kertas kerja</div>

  const RO = { bendahara: 'Bendahara', ppk: 'PPK', pakpa: 'PA/KPA' }, bd = D.users.filter(u => RO[u.peran] && u.aktif).sort((a, b) => OPD.findIndex(o => o.k === a.opd) - OPD.findIndex(o => o.k === b.opd) || Object.keys(RO).indexOf(a.peran) - Object.keys(RO).indexOf(b.peran));
  modal('Kartu akun OPD', `<p class="hint" style="margin-top:0">Setiap akun yang dipilih mendapat <b>kata sandi awal unik</b> dan wajib menggantinya saat pertama masuk. Kata sandi lama langsung tidak berlaku. Kata sandi hanya tampil di kartu ini, jadi cetak atau simpan sebagai PDF lalu serahkan langsung kepada bendaharanya.</p>
    <div style="display:flex;gap:14px;flex-wrap:wrap;font-weight:700;margin:8px 0">${Object.entries(RO).map(([k, n]) => `<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-kr="${k}"> Semua ${n}</label>`).join('')}</div>
    <div style="display:grid;gap:4px;max-height:320px;overflow:auto">${bd.map(u => `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-kb="${u.id}" data-kp="${u.peran}"><span><b>${esc(OPDN[u.opd] || u.opd)}</b> · ${RO[u.peran]} <span class="kode">${esc(u.username)}${u.ganti ? ' · kartu sudah pernah dibuat' : ''}</span></span></label>`).join('')}</div>`,
    '<button class="btn btn-blue" id="mY">Buat sandi & cetak kartu</button>', async () => {
      const ids = [...document.querySelectorAll('[data-kb]:checked')].map(x => +x.dataset.kb);
      if (!ids.length) return toast('Pilih minimal satu akun');
      if (!confirm(`Buat kata sandi awal baru untuk ${ids.length} akun? Kata sandi lama mereka tidak berlaku lagi.`)) return;
      try { const r = await API.post('/api/users/kartu', { ids }); cetakKartu(r.kartu) } catch (e) { toast(e.message) } });
  document.querySelectorAll('[data-kr]').forEach(r => r.onchange = () => document.querySelectorAll(`[data-kp="${r.dataset.kr}"]`).forEach(x => x.checked = r.checked));
}
function formUser(u) {
  const baru = !u; u = u || { username: '', nama: '', nip: '', jabatan: '', peran: 'bendahara', opd: OPD[0].k, aktif: 1 };
  modal(baru ? 'Tambah pengguna' : 'Ubah pengguna', `<div class="fm">${baru ? `<label class="w2">Nama pengguna (huruf kecil, angka, titik)<input id="u1"></label>` : ''}<label class="w2">Nama lengkap<input id="u2" value="${esc(u.nama)}"></label>
    <label>NIP<input id="u3" value="${esc(u.nip || '')}"></label><label>Jabatan<input id="u4" value="${esc(u.jabatan || '')}"></label>
    <label>Peran<select id="u5">${Object.entries(EA.PERAN).map(([k, n]) => `<option value="${k}" ${k === u.peran ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <label>Perangkat daerah<select id="u6"><option value="">–</option>${OPD.map(o => `<option value="${o.k}" ${o.k === u.opd ? 'selected' : ''}>${esc(o.n)}</option>`).join('')}</select></label>
    ${baru ? '' : `<label class="w2" style="flex-direction:row;gap:8px;align-items:center"><input type="checkbox" id="u7" ${u.aktif ? 'checked' : ''}> Akun aktif</label>`}</div>`,
    '<button class="btn btn-blue" id="mY">Simpan</button>', async () => {
      const b = { nama: $('u2').value.trim(), nip: $('u3').value.trim(), jabatan: $('u4').value.trim(), peran: $('u5').value, opd: $('u6').value || null, aktif: baru ? true : $('u7').checked };
      try { if (baru) { b.username = $('u1').value.trim(); const r = await API.post('/api/users', b); tutup(); modal('Pengguna dibuat', `<p>Akun <b>${esc(b.username)}</b> dibuat. Kata sandi awal:</p><p style="font-size:20px;font-family:Consolas,monospace"><b>${esc(r.password)}</b></p><p class="hint">Pengguna wajib menggantinya saat pertama masuk.</p>`, '<button class="btn btn-blue" id="mY">🖨 Cetak kartu akun</button>', () => cetakKartu(r.kartu)) }
        else { await API.put('/api/users/' + u.id, b); tutup(); toast('Pengguna disimpan') } route() } catch (e) { toast(e.message) } });
}

// ================= RIWAYAT
function vLog() {
  return `<div class="card pad"><h2>Riwayat Aktivitas</h2><div class="hint">Jejak audit seluruh tindakan pengguna (300 terakhir).</div>
   <div class="tw" style="margin-top:10px"><table class="tbl"><thead><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Objek</th><th>Keterangan</th></tr></thead><tbody>
   ${D.log.map(r => `<tr><td class="kode">${r.waktu.replace('T', ' ')}</td><td>${esc(r.user)}<div class="kode">${EA.PERAN[r.peran] || ''}</div></td><td><b>${esc(r.aksi)}</b></td><td>${/^[A-Z]+-|^GUI/.test(r.objek) ? `<a href="#kk/${r.objek}">${esc(r.objek)}</a>` : esc(r.objek)}</td><td style="font-size:12px">${esc(r.detail || '')}</td></tr>`).join('')}</tbody></table></div></div>`;
}
const vPH = k => { const m = MENU.find(x => x[0] === k); return `<div class="card ph"><div class="big">🛠</div><h2>${m ? m[1] : 'Modul'}</h2><p class="hint" style="max-width:520px;margin:8px auto 0;font-size:13px">${PH[k] || ''}</p><p class="hint" style="margin-top:14px">Modul ini dijadwalkan pada <b>tahap 2</b> pengembangan.</p></div>` };

// ================= ROUTER
let RUTE = '';
function gambar() {
  const [k, arg] = RUTE.split('/');
  drawMenu(k === 'kk' ? 'pengawasan' : k);
  const T = { dasbor: 'Dasbor', pengawasan: 'Pengawasan Bulanan', kk: 'Kertas Kerja', lhp: 'LHP & Tindak Lanjut', pkpt: 'PKPT Berbasis Risiko', agenda: 'Agenda & Surat Tugas', jdih: 'JDIH Pengawasan Pemerintah Daerah Konawe Selatan', awal: 'Audit Awal Otomatis', pengguna: 'Pengguna & Akses', riwayat: 'Riwayat Aktivitas' };
  $('ttl').textContent = T[k] || (MENU.find(x => x[0] === k) || [, 'e-Audit'])[1];
  const v = $('view');
  if (k === 'dasbor') { v.innerHTML = vDasbor(); document.querySelectorAll('[data-day]').forEach(d => d.onclick = () => { dayIdx = +d.dataset.day; gambar() });
    document.querySelectorAll('[data-opd]').forEach(d => d.onclick = () => { F.opd = d.dataset.opd; F.st = 'ALL'; location.hash = '#pengawasan' });
    document.querySelectorAll('[data-st]').forEach(s => s.onclick = () => cetakST(D.agenda.find(a => a.id === +s.dataset.st))) }
  else if (k === 'pengawasan') { v.innerHTML = vPengawasan(); bindPengawasan() }
  else if (k === 'kk') { v.innerHTML = vKK(arg); bindKK() }
  else if (k === 'lhp' && arg === 'temuan') { v.innerHTML = vLHP(); bindLHP() }
  else if (k === 'lhp' && arg) { v.innerHTML = vLHPEdit(); bindLHPEdit() }
  else if (k === 'lhp') { v.innerHTML = vLHPList(); if ($('lBaru')) $('lBaru').onclick = formLHPBaru }
  else if (k === 'pkpt') { v.innerHTML = vPKPT(); $('pf').onchange = e => { PF = e.target.value; gambar() }; if ($('pAdd')) $('pAdd').onclick = () => formPKPT(); document.querySelectorAll('[data-pe]').forEach(b => b.onclick = () => formPKPT(D.pkpt.find(r => r.id === +b.dataset.pe))) }
  else if (k === 'agenda') { v.innerHTML = vAgenda(); document.querySelectorAll('[data-af]').forEach(b => b.onclick = () => { AF = b.dataset.af; gambar() }); if ($('aAdd')) $('aAdd').onclick = () => formAgenda();
    document.querySelectorAll('[data-ae]').forEach(b => b.onclick = () => formAgenda(D.agenda.find(a => a.id === +b.dataset.ae))); document.querySelectorAll('[data-st]').forEach(b => b.onclick = () => cetakST(D.agenda.find(a => a.id === +b.dataset.st))) }
  else if (k === 'pengguna') { v.innerHTML = vUsers(); $('uAdd').onclick = () => formUser(); $('uKartu').onclick = formKartu; document.querySelectorAll('[data-ue]').forEach(b => b.onclick = () => formUser(D.users.find(u => u.id === +b.dataset.ue)));
    document.querySelectorAll('[data-uo]').forEach(b => b.onclick = () => { const u = D.users.find(x => x.id === +b.dataset.uo);
      modal('Obrik yang ditugaskan · ' + esc(u.nama), `<p class="hint" style="margin-top:0">${EA.PERAN[u.peran]} hanya dapat melihat SPJ, kertas kerja, temuan, dan LHA dari obrik yang dicentang.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${OPD.map(o => `<label style="display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px"><input type="checkbox" data-ob="${o.k}" ${u.obrik.includes(o.k) ? 'checked' : ''}>${esc(o.n)}</label>`).join('')}</div>`,
        '<button class="btn btn-blue" id="mY">Simpan penugasan</button>', async () => { try { await API.put(`/api/users/${u.id}/penugasan`, { obrik: [...document.querySelectorAll('[data-ob]:checked')].map(x => x.dataset.ob) }); tutup(); toast('Penugasan obrik disimpan'); route() } catch (x) { toast(x.message) } }) });
    document.querySelectorAll('[data-ur]').forEach(b => b.onclick = async () => { const u = D.users.find(x => x.id === +b.dataset.ur); if (!confirm('Reset kata sandi ' + u.username + '?')) return; try { const r = await API.post(`/api/users/${u.id}/reset`); modal('Kata sandi baru', `<p>Kata sandi awal baru untuk <b>${esc(u.username)}</b>:</p><p style="font-size:20px;font-family:Consolas,monospace"><b>${esc(r.password)}</b></p><p class="hint">Sandi lama tidak berlaku lagi. Pengguna wajib menggantinya saat pertama masuk.</p>`, '<button class="btn btn-blue" id="mY">🖨 Cetak kartu akun</button>', () => cetakKartu(r.kartu)) } catch (e) { toast(e.message) } }) }
  else if (k === 'riwayat') v.innerHTML = vLog();
  else if (k === 'jdih') JDIH.tampil(v, { kelola: KELOLA });
  else if (k === 'awal') AUDITAWAL.tampil(v, { opd: OPD });
  else v.innerHTML = vPH(k);
}
async function route() {
  RUTE = (location.hash || '#dasbor').slice(1); const k = RUTE.split('/')[0];
  try {
    const perlu = { dasbor: ['spj', 'audit', 'temuan', 'agenda', 'ringkas'], pengawasan: ['spj', 'audit', 'temuan'], kk: ['spj', 'audit'], lhp: RUTE === 'lhp/temuan' ? ['temuan', 'spj', 'audit'] : ['lhp', 'temuan', 'agenda'], pkpt: ['pkpt'], agenda: ['agenda'], pengguna: ['users'], riwayat: ['log'] }[k] || [];
    if (perlu.length) await muat(...perlu);
    if (k === 'lhp' && /^lhp\/\d+$/.test(RUTE)) LH = await API.get('/api/lhp/' + RUTE.split('/')[1]);
    gambar(); window.scrollTo(0, 0);
  } catch (e) { $('view').innerHTML = `<div class="card pad">Gagal memuat data: ${esc(e.message)}</div>` }
}
$('gsearch').onkeydown = e => { if (e.key === 'Enter') { F.q = e.target.value.toLowerCase(); F.opd = 'ALL'; F.st = 'ALL'; if (location.hash === '#pengawasan') route(); else location.hash = '#pengawasan' } };
window.addEventListener('hashchange', route);
route();
})();
</script>
</body>
</html>
